# Whether an issue is in its team's cycle that's running now (Linear works out `isActive` from the
# cycle's start and end), and when that ends. A nested object and two fields, about 1.2 points.
fragment InCycle on Issue {
  cycle {
    isActive
    endsAt
  }
}

# The open issues in these teams that are in their team's current cycle. Only asked when a team
# counts those as urgent. Just ids, teams and the cycle's end, about 1.3 points an issue, so pages
# of 250.
query CurrentCycleIssues($teamIds: [ID!]!, $first: Int!, $after: String) {
  issues(
    first: $first
    after: $after
    filter: {
      team: { id: { in: $teamIds } }
      state: { type: { nin: ["completed", "canceled"] } }
      cycle: { isActive: { eq: true } }
    }
  ) {
    nodes {
      id
      team {
        id
      }
      cycle {
        endsAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
