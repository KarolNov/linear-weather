# The teams a PM can pick on the board, and which of them they're on (the default). Workspaces
# have a handful of teams, so one page is plenty.
query Teams {
  teams(first: 250) {
    nodes {
      ...TeamSummary
    }
  }
  viewer {
    teams(first: 250) {
      nodes {
        id
      }
    }
  }
}

fragment TeamSummary on Team {
  id
  name
  key
}

# Everyone on each of several teams, so people with nothing assigned still get an (empty)
# matrix. Teams the viewer can't see are simply missing. About 330 points a team (250 members
# at 1.3 each), so callers ask for at most 10 teams at a time.
query TeamsMembers($teamIds: [ID!]!, $first: Int!) {
  teams(first: $first, filter: { id: { in: $teamIds } }) {
    nodes {
      id
      members(first: 250) {
        nodes {
          id
          name
          avatarUrl
        }
      }
    }
  }
}
