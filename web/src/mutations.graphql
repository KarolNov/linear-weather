}

mutation RemoveTimeOff($teamId: ID!, $userId: ID!, $timeOffId: ID!) {
  removeTimeOff(teamId: $teamId, userId: $userId, timeOffId: $timeOffId) {
    __typename
    ... on Error {
      message
    }
