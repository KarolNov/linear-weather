# Everything the matrix needs to place and show an issue, and nothing more: each field costs
# 0.1 complexity points and each nested object 1, multiplied by the page size.
fragment IssueCard on Issue {
  id
  identifier
  title
  url
  dueDate
  priority
  estimate
  assignee {
    ...Person
  }
  state {
    name
    type
  }
}

# Someone who holds or can take work. Their status (with its end, read in their time zone) says
# whether they're away, when their team lists it: 4 more fields, about 0.4 points a person.
fragment Person on User {
  id
  name
  avatarUrl
  statusEmoji
  statusLabel
  statusUntilAt
  timezone
}

# Several teams' open issues at once, each tagged with its team. `nodes` rather than
# `edges { node cursor }`: one object fewer per issue, and pageInfo has the only cursor we need.
# Completed and canceled issues aren't anyone's load.
query OpenIssues($teamIds: [ID!]!, $first: Int!, $after: String) {
  issues(
    first: $first
    after: $after
    filter: { team: { id: { in: $teamIds } }, state: { type: { nin: ["completed", "canceled"] } } }
  ) {
    nodes {
      ...IssueCard
      team {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
